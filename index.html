<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2740D8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cuadra · tu negocio al día</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --pri:#2740D8; --pri-d:#1B2FA8; --pri-l:#E8ECFF;
  --acc:#FF8A1F; --acc-l:#FFF1E2;
  --bg:#F5F6FA; --card:#fff; --ink:#151A2E; --mut:#6B7390; --line:#E3E6F0;
  --ok:#12A150; --ok-l:#E3F6EB; --bad:#E5384B; --bad-l:#FDE8EA; --warn:#B7791F; --warn-l:#FFF4D6;
  --r:16px; --navh:64px; --side:232px;
  --sh:0 1px 2px rgba(21,26,46,.06),0 6px 18px rgba(21,26,46,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.hide{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:30px;height:30px}

/* ---------- shell ---------- */
#shell{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .back{display:none;border:0;background:var(--pri-l);color:var(--pri);width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;cursor:pointer}
.top .back.show{display:inline-flex}
.top #cajachip{margin-left:auto}
@media (max-width:899px){.top:not(.ishome) .logo span{display:none}.top.ishome h1{display:none}}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.6px;color:var(--pri-d)}
.logo svg{width:30px;height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;border:0;cursor:pointer}
.chip.ok{background:var(--ok-l);color:var(--ok)} .chip.off{background:var(--bad-l);color:var(--bad)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
main.wideV{max-width:1500px}
main{flex:1;padding:14px;padding-bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom));max-width:1100px;width:100%;margin:0 auto}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--navh);color:var(--mut);text-decoration:none;font-size:11.5px;font-weight:700;cursor:pointer}
nav.nav a.on{color:var(--pri)}
nav.nav a.on svg{stroke-width:2.4}
nav.nav .wide-only{display:none}
.sidelogo{display:none}
.navlbl,.navbiz{display:none}
nav.nav a.on svg{background:var(--pri-l);padding:4px 16px;width:24px;height:24px;box-sizing:content-box;border-radius:999px}

@media (min-width:900px){
  #shell{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:auto 1fr}
  .top{grid-column:2;grid-row:1}
  main{grid-column:2;grid-row:2;padding-bottom:40px;padding:22px 26px}
  nav.nav{position:sticky;top:0;grid-column:1;grid-row:1 / span 2;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:14px 10px;gap:2px;align-self:start}
  .top .back{display:none!important}
  nav.nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:42px;padding:0 14px;border-radius:12px;font-size:15px}
  nav.nav{background:linear-gradient(180deg,#151A2E 0%,#1A2150 55%,#1B2FA8 130%);border-right:0;padding:16px 12px;gap:3px;box-shadow:4px 0 24px rgba(21,26,46,.18)}
  nav.nav .sidelogo{color:#fff}
  nav.nav .sidelogo span{color:#fff}
  .navlbl{display:block!important;font-size:11px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,.38);padding:12px 14px 4px}
  nav.nav a{color:rgba(255,255,255,.72);position:relative;transition:background .15s,color .15s,transform .15s}
  nav.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
  nav.nav a.on{background:linear-gradient(90deg,rgba(255,138,31,.26),rgba(255,255,255,.06));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  nav.nav a.on::before{content:"";position:absolute;left:-12px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--acc);box-shadow:0 0 12px var(--acc)}
  nav.nav a.on svg{color:var(--acc);stroke-width:2.2;background:none;padding:0;width:22px;height:22px;border-radius:0}
  .navbiz{display:flex!important;margin-top:auto;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
  .navbiz .av{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--acc),#FFB766);color:#fff;font-weight:800;display:grid;place-items:center;font-size:17px;flex:none}
  .navbiz b{display:block;color:#fff;font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
  .navbiz small{color:rgba(255,255,255,.55);font-size:12px;font-weight:600}
  nav.nav .wide-only{display:flex}
  nav.nav .narrow-only{display:none}
  .sidelogo{display:flex;padding:8px 10px 18px}
  .top .logo{display:none}
}

/* ---------- kits y datos extra ---------- */
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line);text-align:left;font-size:16px}
.prow span{color:var(--mut);font-weight:600}
.pinfo{margin-top:14px}
.pinfo .nt{font-size:12.5px;color:var(--mut);text-align:left;margin:-4px 2px 6px}
.kit-line{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.kit-line .kn{flex:1;min-width:0}
.kit-line .kn b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kit-line .kn small{color:var(--mut);font-size:12px}
.kit-line .qty input{width:52px;min-height:36px}
.kit-sum{background:var(--pri-l);border-radius:14px;padding:10px 14px;margin:12px 0}
.kit-sum .prow{border-top:0;padding:5px 0;font-size:14.5px}
.badge.kit{background:var(--acc-l);color:#8A4A00}
form[data-form=kit] input[name=margin]{background:#FFF4E5;border-color:#F3D3A3}
form[data-form=kit] input[name=price]{background:#E8F7EE;border-color:#B9E2C8}
form[data-form=kit] input[name=margin]:focus,form[data-form=kit] input[name=price]:focus{background:#fff}
/* ---------- ui ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.panel+.panel{margin-top:12px}
.panel h3{font-size:15px;font-weight:800;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px}
.b{font-weight:800} .right{text-align:right} .center{text-align:center}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.mt{margin-top:12px} .mt2{margin-top:20px} .mb{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#2A1500}
.btn.soft{background:var(--pri-l);border-color:var(--pri-l);color:var(--pri)}
.btn.danger{background:var(--bad-l);border-color:var(--bad-l);color:var(--bad)}
.btn.big{min-height:54px;font-size:17px;width:100%}
.btn.icon{padding:0;width:46px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:4px}
.in{width:100%;min-height:46px;padding:0 14px;border:1.5px solid #D3DAF2;border-radius:12px;background:#EFF3FF;outline:none;transition:background .15s,border-color .15s}
textarea.in{padding:10px 14px;min-height:70px}
.in::placeholder{color:#8B93B3}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l);background:#fff}
main>.searchbar .in,#vsearch .in{background:#fff}
form[data-form=product] input[name=margin]{background:#FFF4E5;border-color:#F3D3A3}
form[data-form=product] input[name=price]{background:#E8F7EE;border-color:#B9E2C8}
form[data-form=product] input[name=margin]:focus,form[data-form=product] input[name=price]:focus{background:#fff}
form[data-form=product] label.f{color:#5A6385}
.fg{margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2>.btn,.g3>.btn{white-space:normal;text-align:center;line-height:1.15;padding-top:8px;padding-bottom:8px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.searchbar{display:flex;gap:8px}
.seg{display:flex;background:#EEF0F7;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;min-height:40px;border-radius:11px;font-weight:800;color:var(--mut);cursor:pointer;font-size:14px}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mut)}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800}
.badge.ok{background:var(--ok-l);color:var(--ok)} .badge.low{background:var(--warn-l);color:var(--warn)} .badge.out{background:var(--bad-l);color:var(--bad)} .badge.gray{background:#EEF0F7;color:var(--mut)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:700} .item .s{font-size:13px;color:var(--mut)}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi .l{font-size:12.5px;color:var(--mut);font-weight:700}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-top:2px}
.kpi.hl{background:var(--pri);border-color:var(--pri);color:#fff} .kpi.hl .l{color:#C9D2FF}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:900px){
  .kpis{grid-template-columns:repeat(4,1fr)}
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:0 18px;align-items:start}
  .hgrid .htips{grid-column:2;grid-row:1}
  .hgrid .hcards{grid-column:1;grid-row:1;grid-template-columns:repeat(3,1fr)}
  .hgrid .htips{margin-top:18px}
}
.mod{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:18px 10px 16px;border-radius:20px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;text-decoration:none;color:inherit;min-height:132px;position:relative;overflow:hidden;transition:transform .12s}
.mod:active{transform:scale(.97)}
.mod::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--mc,var(--pri))}
.mod .ic{width:58px;height:58px;border-radius:50%;background:var(--mb,var(--pri-l));color:var(--mc,var(--pri));display:flex;align-items:center;justify-content:center;margin-top:2px}
.mod .ic svg{width:28px;height:28px}
.mod:nth-child(4n+1){--mc:#2447D0;--mb:#E8EDFF}
.mod:nth-child(4n+2){--mc:#C25E00;--mb:#FFEEDB}
.mod:nth-child(4n+3){--mc:#0E9F58;--mb:#DDF6E8}
.mod:nth-child(4n){--mc:#8A3FD1;--mb:#F1E6FB}
.mod b{font-size:15px;line-height:1.2} .mod span{font-size:12.5px;color:var(--mut);margin-top:-4px;line-height:1.25}
.tip{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:13px;background:#F0F3FF;margin-top:8px;font-size:14.5px;cursor:default}
.tip.bad{background:var(--bad-l)} .tip.warn{background:var(--warn-l)} .tip.ok{background:var(--ok-l)}
.tip button{margin-left:auto;border:0;background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:13px;color:var(--pri);white-space:nowrap}
.empty{text-align:center;padding:28px 14px;color:var(--mut)}
.empty .big{font-size:44px}
.empty b{display:block;color:var(--ink);font-size:17px;margin:6px 0 4px}
.banner{background:var(--acc-l);border:1px solid #FFD6A8;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:12px}
.banner button{margin-left:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
.scroll-x{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mut)}
.bars .bar i{display:block;width:100%;max-width:38px;background:var(--pri);border-radius:8px 8px 3px 3px;min-height:3px}
.bars .bar.today i{background:var(--acc)}
.hbar{height:10px;border-radius:6px;background:#EEF0F7;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--pri);border-radius:6px}

/* sale layout */
.vgrid{display:grid;gap:12px;grid-template-areas:"s" "c" "r"}

.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:600px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1200px){.pgrid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1500px){.pgrid{grid-template-columns:repeat(5,1fr)}}
.vgrid>*{min-width:0}
.vchips{margin-bottom:10px}
.total.big{font-size:26px}
.kbd{font:700 11px/1 inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 6px;color:var(--mut);margin-left:6px;background:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;min-height:84px}
.pcard:active{background:var(--pri-l)} .pcard .n{font-weight:700;font-size:14.5px;line-height:1.2} .pcard .p{font-weight:800;color:var(--pri);margin-top:auto}
.pcard .st{font-size:12px;color:var(--mut)} .pcard.out{opacity:.55}
.cline{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cline:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:18px;cursor:pointer;line-height:1}
.qty input{width:48px;height:34px;text-align:center;border:1.5px solid var(--line);border-radius:10px;font-weight:800}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:26px;letter-spacing:-.5px;margin:10px 0}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(15,20,45,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:up .18s ease-out}
.sheet.wide{max-width:760px}
.ovl.top{align-items:flex-start;padding:max(10px,env(safe-area-inset-top)) 10px 0}.ovl.top .sheet{border-radius:20px;max-height:calc(100dvh - 20px)}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.sh-h h3{font-size:18px;font-weight:800}
.x{border:0;background:#EEF0F7;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;color:var(--mut)}
.sh-b{padding:8px 16px 18px;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.ovl{align-items:center}.sheet{border-radius:22px}}
.pm{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pm button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font-weight:800;text-align:left}
.pm button small{font-weight:600;color:var(--mut);font-size:12px}
.pm button.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-weight:700;cursor:pointer;font-size:13px}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14.5px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .15s}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)} .toast.warn{background:#8A5A00}
video#cam{width:100%;border-radius:16px;background:#000;max-height:60vh}
.hero{background:linear-gradient(135deg,var(--pri) 0%,#4B63F0 100%);color:#fff;border-radius:22px;padding:22px 20px;box-shadow:var(--sh)}
.hero h2{font-size:26px;letter-spacing:-.6px}
.onb{max-width:460px;width:100%;margin:0 auto;padding:18px;grid-column:1 / -1}
.onb .panel{margin-top:14px}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:monospace;font-size:12px;width:72mm;color:#000}
  #print h4{text-align:center;font-size:14px;margin-bottom:4px}
  #print .l{display:flex;justify-content:space-between;gap:8px}
  #print hr{border:0;border-top:1px dashed #000;margin:6px 0}
  @page{margin:4mm}
}


@page carta{size:letter;margin:14mm 15mm}
@media print{
 html,body{background:#fff!important}
 #print.carta{page:carta;display:block;width:auto;font-family:Arial,Helvetica,sans-serif;font-size:11pt;line-height:1.35;color:#000}
 #print.carta .cp-h{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px}
 #print.carta .cp-h img{max-height:56px;max-width:120px;object-fit:contain}
 #print.carta .cp-h b{font-size:16pt;display:block}#print.carta .cp-h small{font-size:9.5pt;color:#333}
 #print.carta h2{font-size:15pt;margin:4px 0 2px;text-align:center;letter-spacing:.3px}

/* ---------- estado y almacenamiento (IndexedDB, con respaldo en localStorage) ---------- */
let S, useLS=false, idb=null;
const blank=()=>({v:1,meta:{business:'',owner:'',type:'',created:Date.now(),practice:false,lastBackup:0},counters:{sale:0,code:0},products:[],customers:[],suppliers:[],sales:[],purchases:[],payments:[],movements:[],cajas:[]});
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('cuadra',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const idbGet=k=>new Promise((res,rej)=>{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbSet=(k,v)=>new Promise((res,rej)=>{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});
async function loadState(){
  try{idb=await idbOpen();S=await idbGet('state')}catch(e){useLS=true}
  if(useLS){try{S=JSON.parse(localStorage.getItem('cuadra_state')||'null')}catch(e){S=null}}
  if(!S)S=blank();
  S={...blank(),...S};
  try{syncKits()}catch(e){}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
let saveT;
function save(){try{syncKits()}catch(e){}clearTimeout(saveT);saveT=setTimeout(persist,120)}
async function persist(){
  try{ if(useLS)localStorage.setItem('cuadra_state',JSON.stringify(S)); else await idbSet('state',S);}
  catch(e){toast('No se pudo guardar. Descarga una copia de seguridad ya.','bad')}
}
addEventListener('pagehide',persist);
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});

/* ---------- derivados ---------- */
const openCaja=()=>S.cajas.find(c=>!c.closedAt);
const prod=id=>S.products.find(p=>p.id===id);
/* ---------- kits o listas: un producto armado con varios ---------- */
const isKit=p=>!!(p&&Array.isArray(p.kit)&&p.kit.length);
function kitStock(p){let m=Infinity;for(const c of p.kit){const q=prod(c.pid);if(!q)return 0;m=Math.min(m,Math.floor(Math.max(0,q.stock)/(c.qty||1)+1e-9))}return m===Infinity?0:m}
const kitCost=p=>sum(p.kit,c=>{const q=prod(c.pid);return q?(q.cost||0)*c.qty:0});
const kitRef=p=>sum(p.kit,c=>{const q=prod(c.pid);return q?(q.price||0)*c.qty:0});
function syncKits(){if(!S||!S.products)return;S.products.forEach(p=>{if(isKit(p)){p.stock=kitStock(p);p.cost=Math.round(kitCost(p));p.min=0}})}
function moveStock(p,d){
  if(isKit(p)){p.kit.forEach(c=>{const q=prod(c.pid);if(q)q.stock=Math.round((q.stock+d*c.qty)*1000)/1000})}
  else p.stock=Math.round((p.stock+d)*1000)/1000;
  syncKits();
}
const pkey=p=>norm((p.name||'')+' '+(p.brand||'')+' '+(p.ref||''));
const pbr=p=>{const a=[p.brand,p.ref?'Ref. '+p.ref:''].filter(Boolean).map(esc);return a.length?a.join(' · ')+' · ':''};
const cust=id=>S.customers.find(c=>c.id===id);
const supp=id=>S.suppliers.find(s=>s.id===id);
function custBalance(id){
  return sum(S.sales.filter(s=>!s.void&&s.method==='fiado'&&s.customerId===id),s=>s.total)
       - sum(S.payments.filter(p=>p.type==='cliente'&&p.refId===id&&!p.void),p=>p.amount);
}
function suppBalance(id){
  return sum(S.purchases.filter(s=>s.method==='credito'&&s.supplierId===id),s=>s.total)
       - sum(S.payments.filter(p=>p.type==='proveedor'&&p.refId===id),p=>p.amount);
}
const totalCartera=()=>sum(S.customers,c=>Math.max(0,custBalance(c.id)));
function cajaSum(c){
  const r={initial:c.initial,cash:0,digital:0,fiado:0,auto:0,nSales:0,abonosCash:0,ingresos:0,gastos:0,egresos:0,comprasCash:0,pagosProvCash:0};
  for(const s of S.sales){ if(s.cajaId!==c.id||s.void)continue; r.nSales++;
    if(s.method==='efectivo')r.cash+=s.total; else if(s.method==='digital')r.digital+=s.total; else if(s.method==='fiado')r.fiado+=s.total; else r.auto+=s.total;}
  for(const p of S.payments){ if(p.cajaId!==c.id||p.void||p.method!=='efectivo')continue;
    if(p.type==='cliente')r.abonosCash+=p.amount; else r.pagosProvCash+=p.amount;}
  for(const m of S.movements){ if(m.cajaId!==c.id)continue;
    if(m.type==='ingreso')r.ingresos+=m.amount; else if(m.type==='gasto')r.gastos+=m.amount; else r.egresos+=m.amount;}
  for(const p of S.purchases){ if(p.cajaId!==c.id||p.method!=='efectivo')continue; r.comprasCash+=p.total;}
  r.expected=r.initial+r.cash+r.abonosCash+r.ingresos-r.gastos-r.egresos-r.comprasCash-r.pagosProvCash;
  return r;
}
function cajaWin(c){
  const a=c.openedAt,b=c.closedAt||Date.now()+1;let pEf=0,pDig=0,pCre=0,pagos=0;
  for(const x of S.purchases){if(x.ts<a||x.ts>b)continue;if(x.method==='efectivo')pEf+=x.total;else if(x.method==='digital')pDig+=x.total;else pCre+=x.total}
  for(const x of S.payments){if(x.void||x.type==='cliente'||x.ts<a||x.ts>b)continue;pagos+=x.amount}
  return{pEf,pDig,pCre,pagos};
}
function range(k){
  const t0=sod(Date.now());
  if(k==='ayer')return[t0-DAY,t0];
  if(k==='7d')return[t0-6*DAY,t0+DAY];
  if(k==='mes'){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return[d.getTime(),t0+DAY]}
  if(k==='todo')return[0,t0+DAY];
  return[t0,t0+DAY];
}
const salesIn=(a,b)=>S.sales.filter(s=>!s.void&&s.ts>=a&&s.ts<b);
const profit=ss=>sum(ss.filter(s=>s.method!=='autoconsumo'),s=>s.total-(s.delivery||0)-s.cost);

/* ---------- avisos (el "Cuadra te dice") ---------- */
function insights(){
  const out=[], now=Date.now(), [t0]=range('hoy');
  if(!S.products.length)out.push({t:'',x:'Empieza creando tus productos. Puedes escanear el código de barras con la cámara.',go:'productos',l:'Crear'});
  const agot=S.products.filter(p=>p.stock<=0).length;
  const bajo=S.products.filter(p=>p.stock>0&&p.stock<=p.min).length;
  if(agot)out.push({t:'bad',x:`${agot} ${plural(agot,'producto agotado','productos agotados')}. Revisa qué toca reponer.`,go:'productos?f=agotado',l:'Ver'});
  if(bajo)out.push({t:'warn',x:`${bajo} ${plural(bajo,'producto está','productos están')} por acabarse.`,go:'productos?f=bajo',l:'Ver'});
  const venc=S.products.filter(p=>{const x=expDays(p);return x!==null&&x<0&&p.stock>0}).length,pven=S.products.filter(p=>{const x=expDays(p);return x!==null&&x>=0&&x<=7&&p.stock>0}).length;
  if(venc)out.push({t:'bad',x:`${venc} ${plural(venc,'producto vencido','productos vencidos')} con existencias. Sácalos de la venta.`,go:'productos?f=vence',l:'Ver'});
  if(pven)out.push({t:'warn',x:`${pven} ${plural(pven,'producto vence','productos vencen')} en los próximos 7 días.`,go:'productos?f=vence',l:'Ver'});
  const deud=S.customers.map(c=>({c,b:custBalance(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
  if(deud.length){
    const top=deud[0];
    const abonos=S.payments.filter(p=>p.type==='cliente'&&p.refId===top.c.id&&!p.void).map(p=>p.ts);
    const fiados=S.sales.filter(s=>!s.void&&s.method==='fiado'&&s.customerId===top.c.id).map(s=>s.ts);
    const last=abonos.length?Math.max(...abonos):Math.min(...fiados);
    const dias=Math.floor((now-last)/DAY);
    out.push({t:dias>=15?'warn':'',x:`Te deben ${money(totalCartera())} en total. El que más debe es ${esc(top.c.name)} (${money(top.b)})${dias>=15?`, lleva ${dias} días sin abonar`:''}.`,go:'clientes',l:'Cobrar'});
  }
  const yS=salesIn(t0-DAY,t0);
  if(yS.length&&!salesIn(t0,t0+DAY).length)out.push({t:'ok',x:`Ayer vendiste ${money(sum(yS.filter(s=>s.method!=='autoconsumo'),s=>s.total))} y tu ganancia estimada fue ${money(profit(yS))}.`});
  if(S.sales.length&&Date.now()-S.meta.lastBackup>7*DAY&&!S.meta.practice)out.push({t:'warn',x:'Hace más de una semana que no guardas una copia de seguridad. Tus datos viven solo en este equipo.',go:'mas',l:'Respaldar'});
  if(!openCaja()&&S.products.length)out.push({t:'',x:'<b>La caja está cerrada.</b> Ábrela para empezar a vender.',go:'caja',l:'Abrir'});
  return out;
}

/* ---------- toasts, modales, confirmaciones ---------- */
function toast(m,t=''){
  const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);
  setTimeout(()=>e.remove(),t==='bad'||t==='warn'?4200:2200);
}
function modal(title,body,o={}){
  const ov=document.createElement('div');ov.className='ovl'+(o.top?' top':'');
  ov.innerHTML=`<div class="sheet ${o.wide?'wide':''}" role="dialog" aria-modal="true"><div class="sh-h"><h3>${title}</h3><button class="x" data-act="close" aria-label="Cerrar">×</button></div><div class="sh-b">${body}</div></div>`;
  ov._close=o.onClose;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal(ov)});
  document.body.appendChild(ov);
  const f=$('[autofocus]',ov);if(f)setTimeout(()=>{f.focus();f.select&&f.select()},60);
  return ov;
}
function closeModal(ov){ov=ov||$$('.ovl').pop();if(!ov)return;ov.remove();ov._close&&ov._close()}
const modalEl=()=>$$('.ovl').pop();
function ask(title,text,ok='Aceptar',danger=false){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(!done){done=true;res(v)}};
    const ov=modal(title,`<p class="mut" style="margin:6px 0 16px">${text}</p><div class="g2"><button class="btn" data-act="close">Cancelar</button><button class="btn ${danger?'danger':'pri'}" data-act="ask-ok">${ok}</button></div>`,{onClose:()=>fin(false)});
    ov._ok=()=>{fin(true);ov.remove()};
  });
}

/* ---------- sonido y cámara ---------- */
let actx;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(actx.currentTime+.09)}catch(e){}}
async function scanner(onCode,continuous){
  if(!('BarcodeDetector' in window)){toast('Este navegador no lee códigos con cámara. Usa la pistola lectora o escribe el código.','warn');return}
  let stream,stop=false,last='',lastT=0;
  const ov=modal('Escanear código',`<video id="cam" playsinline muted></video><p class="mut sm center mt">Apunta al código de barras. ${continuous?'Puedes seguir escaneando.':''}</p><button class="btn big mt" data-act="close">Terminar</button>`,{onClose:()=>{stop=true;stream&&stream.getTracks().forEach(t=>t.stop())}});
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('#cam',ov);v.srcObject=stream;await v.play();
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});
    const tick=async()=>{
      if(stop)return;
      try{const r=await det.detect(v);
        if(r.length){const c=r[0].rawValue,n=Date.now();
          if(c!==last||n-lastT>1600){last=c;lastT=n;beep();onCode(c);if(!continuous){closeModal(ov);return}}}
      }catch(e){}
      setTimeout(tick,180);
    };tick();
  }catch(e){closeModal(ov);toast('No pude abrir la cámara. Revisa el permiso del navegador.','bad')}
}

function mvRows(a,b){
  const R=[],M={efectivo:'Efectivo',digital:'Transferencia',fiado:'Fiado',autoconsumo:'Consumo propio',credito:'A crédito'};
  for(const x of S.sales){if(x.void||x.ts<a||x.ts>=b)continue;
    const fl=(x.method==='efectivo'||x.method==='digital')?'in':'n';
    R.push({ts:x.ts,fl,amt:x.total,ic:'cart',t:(x.ret?'Devolución #':'Venta #')+x.no,s:M[x.method]+(x.customerId&&cust(x.customerId)?' · '+cust(x.customerId).name:''),act:'sale-detail',id:x.id})}
  for(const x of S.payments){if(x.void||x.ts<a||x.ts>=b)continue;
    if(x.type==='cliente')R.push({ts:x.ts,fl:'in',amt:x.amount,ic:'users',t:'Abono de '+((cust(x.refId)||{}).name||'cliente'),s:M[x.method]||x.method});
    else R.push({ts:x.ts,fl:'out',amt:x.amount,ic:'truck',t:'Pago a '+((supp(x.refId)||{}).name||'proveedor'),s:M[x.method]||x.method})}
  for(const x of S.purchases){if(x.ts<a||x.ts>=b)continue;
    R.push({ts:x.ts,fl:x.method==='credito'?'n':'out',amt:x.total,ic:'bag',t:'Compra a '+((supp(x.supplierId)||{}).name||'proveedor'),s:M[x.method],act:'purchase-detail',id:x.id})}
  for(const x of S.movements){if(x.ts<a||x.ts>=b)continue;
    const T={ingreso:['in','Ingreso'],gasto:['out','Gasto'],egreso:['out','Retiro']}[x.type]||['out','Movimiento'];
    R.push({ts:x.ts,fl:T[0],amt:x.amount,ic:'wallet',t:x.concept,s:T[1]+(x.cat?' · '+x.cat:'')+(x.method==='digital'?' · Transferencia':''),gasto:x.type==='gasto'})}
  return R.sort((p,q)=>q.ts-p.ts);
}

/* PUM + CÓDIGOS DE BARRAS + ETIQUETAS */
const PUMU={g:{f:1000,b:'kg',n:'kilogramo (kg)'},kg:{f:1,b:'kg',n:'kilogramo (kg)'},ml:{f:1000,b:'L',n:'litro (L)'},l:{f:1,b:'L',n:'litro (L)'},m:{f:1,b:'m',n:'metro (m)'},cm:{f:100,b:'m',n:'metro (m)'},und:{f:1,b:'u',n:'unidad'}};
const UNL={g:'g',kg:'kg',ml:'ml',l:'L',m:'m',cm:'cm',und:'und'};
// PUM = precio de venta ÷ (contenido neto convertido a kg, L, m o unidad)
function pum(p){const u=PUMU[p.unit];if(!u||!(p.net>0)||!(p.price>0))return null;const base=p.net/u.f;return{v:Math.round(p.price/base),name:u.n,net:`${qfmt(p.net)} ${UNL[p.unit]}`}}
function pumHint(){const f=document.querySelector('form[data-form=product]');if(!f)return;const el=$('#pumh');if(!el)return;
  const r=pum({net:dec(f.net.value),unit:f.unit.value,price:digits(f.price.value)});
  el.innerHTML=r?`PUM: <b>${money(r.v)}</b> por ${r.name}. Fórmula: precio ÷ contenido en ${PUMU[f.unit.value].b==='u'?'unidades':PUMU[f.unit.value].n}.`:'Si el producto se vende por peso, volumen o tamaño, escribe cuánto trae y Cuadra calcula el PUM.'}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('form[data-form=product]'))pumHint()});
document.addEventListener('change',e=>{if(e.target.name==='unit')pumHint()});
const eanCheck=d=>{let t=0;for(let i=0;i<12;i++)t+=+d[i]*(i%2?3:1);return(10-t%10)%10};
function validEAN(c){c=String(c||'');if(!/^\d+$/.test(c))return false;if(c.length===13)return eanCheck(c)===+c[12];if(c.length===12)return eanCheck('0'+c.slice(0,11))===+c[11];if(c.length===8){let t=0;for(let i=0;i<7;i++)t+=+c[i]*(i%2?1:3);return(10-t%10)%10===+c[7]}return false}
function newCode(){let c;do{S.counters.own=(S.counters.own||0)+1;const b='20'+String(S.counters.own).padStart(10,'0');c=b+eanCheck(b)}while(S.products.some(p=>p.barcode===c));save();return c}
const EL=['0001101','0011001','0010011','0111101','0100011','0110001','0101111','0111011','0110111','0001011'],EG=['0100111','0110011','0011011','0100001','0011101','0111001','0000101','0010001','0001001','0010111'],ER=['1110010','1100110','1101100','1000010','1011100','1001110','1010000','1000100','1001000','1110100'],EP=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
const C39={'0':'nnnwwnwnn','1':'wnnwnnnnw','2':'nnwwnnnnw','3':'wnwwnnnnn','4':'nnnwwnnnw','5':'wnnwwnnnn','6':'nnwwwnnnn','7':'nnnwnnwnw','8':'wnnwnnwnn','9':'nnwwnnwnn','*':'nwnnwnwnn'};
function barBits(code){
  code=String(code||'').replace(/\s/g,'');if(!/^\d+$/.test(code))return null;let b='',txt=code;
  if(code.length===12)code='0'+code;
  if(code.length===13){const par=EP[+code[0]];b='101';for(let i=1;i<=6;i++)b+=(par[i-1]==='L'?EL:EG)[+code[i]];b+='01010';for(let i=7;i<=12;i++)b+=ER[+code[i]];b+='101';return{bits:b,txt:code.length===13&&txt.length===12?txt:code}}
  if(code.length===8){b='101';for(let i=0;i<4;i++)b+=EL[+code[i]];b+='01010';for(let i=4;i<8;i++)b+=ER[+code[i]];b+='101';return{bits:b,txt:code}}
  const full='*'+code+'*';full.split('').forEach((ch,k)=>{const pt=C39[ch];if(k)b+='0';[...pt].forEach((x,i)=>{const w=x==='w'?3:1;b+=(i%2?'0':'1').repeat(w)})});return{bits:b,txt:code}
}
function barSVG(code){
  const r=barBits(code);if(!r)return '';const q=10,W=r.bits.length+q*2;let x=0,out='';
  while(x<r.bits.length){if(r.bits[x]==='1'){let y=x;while(y<r.bits.length&&r.bits[y]==='1')y++;out+=`<rect x="${x+q}" y="0" width="${y-x}" height="60"/>`;x=y}else x++}
  return `<svg viewBox="0 0 ${W} 60" preserveAspectRatio="none" shape-rendering="crispEdges" style="width:100%;height:100%;display:block" fill="#000">${out}</svg>`;
}
const fmtCode=c=>{c=String(c);return c.length===13?`${c[0]} ${c.slice(1,7)} ${c.slice(7)}`:c};

  const piso=dec(fd.get('piso')||'0'),bod=dec(fd.get('bod')||'0');
  if(!(piso>=0)||!(bod>=0))return toast('Escribe cantidades válidas','warn');
  const old=cn.items[id];
  cn.items[id]={name:p.name,cost:p.cost||0,barcode:p.barcode||'',piso,bod,sys:old?old.sys:p.stock,sysBod:old?old.sysBod:bodQ(p)};
  save();closeModal();cntRender();
  toast(`${p.name} · ${qfmt(piso+bod)} und`,'ok');
  if(f.dataset.cam)setTimeout(scanCount,250);
}
function scanCount(){
  scanner(c=>{const p=S.products.find(x=>x.barcode===c);
    if(p&&!isKit(p))cntAsk(p.id,true);else toast(p?'Los kits no se cuentan; cuenta sus productos':`Código ${c} no existe`,'warn')},false);
}
function cntSignBadge(d){return d===0?'<span class="badge ok">Cuadra</span>':d>0?`<span class="badge" style="background:#E3EAFF;color:#1B3BB3">Sobran ${qfmt(d)}</span>`:`<span class="badge out">Faltan ${qfmt(-d)}</span>`}
function cntRender(){
  const cn=cntDraft();if(!cn)return;
  const rows=cntRows(cn),st=cntStats(rows);
  const k=$('#ckp');if(k)k.innerHTML=`<div class="kpi hl"><div class="l">Productos contados</div><div class="v">${st.n}</div></div><div class="kpi"><div class="l">Con diferencia</div><div class="v">${st.nDif}</div></div><div class="kpi"><div class="l">Faltan (merma)</div><div class="v bad">${qfmt(st.uFalt)} und</div><div class="xs mut">${money(st.vFalt)} al costo</div></div><div class="kpi"><div class="l">Sobran</div><div class="v">${qfmt(st.uSob)} und</div></div>`;
  const l=$('#cl');if(l)l.innerHTML=rows.length?rows.map(r=>`<button class="item" data-act="cnt-ask" data-id="${r.id}"><div class="grow"><div class="t">${esc(r.name)}</div><div class="s">Piso <b>${qfmt(r.piso)}</b> · Bodega <b>${qfmt(r.bod)}</b> = ${qfmt(r.tot)} · sistema ${qfmt(r.sys)}</div></div><div class="right">${cntSignBadge(r.diff)}</div></button>`).join(''):'<div class="empty">Escanea el primer producto para empezar</div>';
  const res=$('#cres');if(res){const q=cnt.q.trim();res.innerHTML=q?findProducts(q,6,false).filter(p=>!isKit(p)).map(p=>`<button class="item" data-act="cnt-ask" data-id="${p.id}"><div class="grow"><div class="t">${esc(p.name)}</div><div class="s">${pbr(p)}sistema ${qfmt(p.stock)}${p.barcode?' · '+esc(p.barcode):''}</div></div><span class="badge gray">Contar</span></button>`).join('')||'<div class="mut sm">Sin resultados</div>':''}
}
function cntText(cn,title){
  const rows=cntRows(cn),st=cntStats(rows);
  let t=`*${title||'Conteo de inventario'} · ${S.meta.business}*\n${fmtDT(cn.ts)}${cn.by?'\nContó: '+cn.by:''}\n\nProductos contados: ${st.n}\nCon diferencia: ${st.nDif}\n\n*MERMAS (faltantes)*\n`;
  t+=st.falt.length?st.falt.map(r=>`• ${r.name}: sistema ${qfmt(r.sys)}, contó ${qfmt(r.tot)} (piso ${qfmt(r.piso)} / bodega ${qfmt(r.bod)}) → faltan ${qfmt(-r.diff)} = ${money(-r.val)}`).join('\n'):'Ninguna';
  t+=`\nTotal merma: ${qfmt(st.uFalt)} und = ${money(st.vFalt)}`;
  if(st.sob.length)t+=`\n\n*SOBRANTES*\n`+st.sob.map(r=>`• ${r.name}: sobran ${qfmt(r.diff)} = ${money(r.val)}`).join('\n');
  return t;
}
function cntHTML(cn,title){
  const rows=cntRows(cn),st=cntStats(rows);
  const dtxt=r=>r.diff<0?'−'+qfmt(-r.diff):r.diff>0?'+'+qfmt(r.diff):'0';
  const all=rows.map(r=>cR([esc(r.name),qfmt(r.sys),qfmt(r.piso),qfmt(r.bod),qfmt(r.tot),dtxt(r),r.diff<0?money(-r.val):'—'],['','r','r','r','r','r','r']));
  all.push(cR(['TOTALES','','','','',(st.uSob-st.uFalt>0?'+':st.uSob-st.uFalt<0?'−':'')+qfmt(Math.abs(st.uSob-st.uFalt)),money(st.vFalt)],['','r','r','r','r','r','r'],1));
  return cartaPage((title||'Conteo de inventario')+' · Reporte de mermas',`${fmtDT(cn.ts)}${cn.by?' · Contó: '+esc(cn.by):''}${cn.applied?' · Diferencias aplicadas':''}`,
   `${cT([cR(['Productos contados',st.n],['','r']),cR(['Productos con diferencia',st.nDif],['','r']),cR(['Unidades faltantes (merma)',qfmt(st.uFalt)],['','r']),cR(['Valor de la merma al costo',money(st.vFalt)],['','r'],1),cR(['Unidades sobrantes',qfmt(st.uSob)],['','r'])],['Resumen','Valor'],['','r'])}
   <h3>Detalle por producto (piso de venta y bodega)</h3>${cT(all,['Producto','Sistema','Piso','Bodega','Contado','Dif.','Merma $'],['','r','r','r','r','r','r'])}
   <div class="cp-sig"><div>Contó</div><div>Revisó</div></div>`);
}
function cntApply(){
  const cn=cntDraft();if(!cn)return;const rows=cntRows(cn),st=cntStats(rows);
  if(!rows.length)return toast('Cuenta al menos un producto','warn');
  ask('Aplicar diferencias',`Se ajustará el inventario de ${st.n} ${st.n===1?'producto':'productos'}: ${qfmt(st.uFalt)} unidades de merma (${money(st.vFalt)}) y ${qfmt(st.uSob)} de sobrante. También queda guardado dónde está cada cosa (piso y bodega). No se puede deshacer.`,'Aplicar',true).then(ok=>{
    if(!ok)return;
    rows.forEach(r=>{const p=prod(r.id);if(!p)return;const after=Math.round((p.stock+r.diff)*1000)/1000;
      if(r.diff!==0)(S.adjusts=S.adjusts||[]).push({id:uid(),ts:Date.now(),pid:p.id,name:p.name,before:p.stock,after,why:'Conteo de inventario'});
      p.stock=Math.max(0,after);p.bod=Math.min(r.bod,p.stock)});
    cn.applied=Date.now();(S.conteos=S.conteos||[]).push(cn);S.conteoDraft=null;save();
    toast('Diferencias aplicadas. Inventario actualizado','ok');cntView(cn.id);render();
  });
}

    const top=fv.length?fv:S.products.filter(p=>p.stock>0).slice().sort((a,b)=>(b.sold||0)-(a.sold||0)).slice(0,6);

function catalog(){
  const cats=[...new Set(S.products.map(p=>p.cat).filter(Boolean))];let cur='';
  const ov=modal('Todos los productos',`<input class="in" id="cq" placeholder="Buscar" autocomplete="off"><div class="chips mt" id="cch"></div><div id="cbody" class="mt"></div><button class="btn pri big mt" data-act="close">Listo</button>`,{wide:true});
  const draw=()=>{const q=norm($('#cq',ov).value.trim());
    $('#cch',ov).innerHTML=cats.length?`<button data-c="" class="${cur?'':'on'}">Todos</button>${cats.map(c=>`<button data-c="${esc(c)}" class="${cur===c?'on':''}">${esc(c)}</button>`).join('')}`:'';
    const r=S.products.filter(p=>(!cur||p.cat===cur)&&(!q||norm(p.name).includes(q))).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,120);
    $('#cbody',ov).innerHTML=r.length?`<div class="pgrid">${r.map(p=>`<button class="pcard ${p.stock<=0?'out':''}" data-act="add-cart" data-id="${p.id}">${p.img?`<img class="pcimg" src="${p.img}" alt="">`:''}<span class="n">${esc(p.name)}</span><span class="st">${p.stock<=0?'Agotado':'Quedan '+qfmt(p.stock)}</span><span class="p">${money(p.price)}</span></button>`).join('')}</div>`:'<div class="empty"><b>Sin resultados</b></div>'};
  $('#cq',ov).addEventListener('input',draw);
  $('#cch',ov).addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(b){cur=b.dataset.c;draw()}});
  draw();
}
function findProducts(q,limit=40,nameOnly=false){
  q=norm(q.trim());
  if(!q)return S.products.slice().sort((a,b)=>(b.sold||0)-(a.sold||0)||a.name.localeCompare(b.name)).slice(0,limit);
  const exact=S.products.filter(p=>p.barcode&&p.barcode===q);
  if(exact.length)return exact;
  return S.products.filter(p=>pkey(p).includes(q)||(p.barcode||'').includes(q)||(!nameOnly&&norm(p.cat).includes(q))).slice(0,limit);
}
function enterSale(v){
  if(!v)return;
  const exact=S.products.find(p=>p.barcode===v);
  if(exact){$('#vq').value='';renderRes();S.meta.askQty!==false?saleAsk(exact.id,false):addCart(exact.id);return}
  const r=findProducts(v,2,true);
  if(r.length>=1){addCart(r[0].id);$('#vq').value='';renderRes();return}
  if(!r.length){
    if(/^\d{5,}$/.test(v)){toast(`Código ${v} no existe. Créalo ahora.`,'warn');productForm(null,{barcode:v,addToCart:true})}
    else toast('No encontré ese producto','warn');
  }
}
function scanSale(){
  scanner(c=>{const p=S.products.find(x=>x.barcode===c);
    if(p)saleAsk(p.id,true);
    else{toast(`Código ${c} no existe. Créalo ahora.`,'warn');productForm(null,{barcode:c,addToCart:true,cam:true})}
  },false);
}
function saleAsk(id,cam){
  const p=prod(id);if(!p)return;
  if(p.bulk){weighForm(id,cam);return}
  const l=cart.find(x=>x.pid===id);
  modal('¿Cuántas unidades?',`<form data-form="saleqty" data-id="${id}" data-cam="${cam?1:''}">
   <div class="b" style="font-size:18px">${esc(p.name)}</div>
   <div class="mut sm" style="margin:2px 0 12px">${p.brand?esc(p.brand)+' · ':''}${money(p.price)} c/u · hay ${qfmt(p.stock)}${l?` · ya llevas ${qfmt(l.qty)}`:''}</div>
   <div class="fg"><label class="f">Unidades</label><input class="in" name="qty" value="1" inputmode="decimal" required autofocus style="font-size:26px;font-weight:800;text-align:center;min-height:58px"></div>
   <button class="btn pri big">${cam?'Agregar y escanear el siguiente':'Agregar a la venta'}</button></form>`,{top:true});
}
function addCartQty(id,q){
  const p=prod(id);if(!p)return;
  const l=cart.find(x=>x.pid===id);
  if(l)l.qty=Math.round((l.qty+q)*1000)/1000;else cart.push({pid:id,name:p.name,price:p.price,cost:p.cost,qty:q});
  renderCart();
  toast(`${p.name} · ${qfmt(q)} und`,'ok');
}
function addCart(id,fromScan){
  const p=prod(id);if(!p)return;
  const l=cart.find(x=>x.pid===id);
  if(p.bulk){weighForm(id);return}
  if(l)l.qty+=1;else cart.push({pid:id,name:p.name,price:p.price,cost:p.cost,qty:1});
  renderCart();
  toast(`${p.name} · ${money(prodPrice(p,(l?l.qty:1)))}`,'ok');
}

function cobrar(m){
  if(!cart.length)return;

    pay={m:(typeof m==='string'?m:'efectivo'),cust:cartX.cust};
    const t=cartTotal();
    modal('Cobrar',`

function payPanel(){
  const t=cartTotal(),el=$('#paypanel');if(!el)return;
  $$('#pm button').forEach(b=>b.classList.toggle('on',b.dataset.m===pay.m));
  if(pay.m==='efectivo'){
    const q=[...new Set([t,Math.ceil(t/5000)*5000,Math.ceil(t/10000)*10000,Math.ceil(t/50000)*50000,100000].filter(x=>x>=t))].slice(0,5);
    el.innerHTML=`<label class="f">¿Cuánto te dieron?</label><input id="recv" class="in money" inputmode="numeric" placeholder="${fmtInt(t)}" autofocus>
      <div class="quick">${q.map(x=>`<button type="button" data-act="quick" data-v="${x}">${x===t?'Exacto':money(x)}</button>`).join('')}</div>

  }else if(pay.m==='digital'){
    el.innerHTML=`<div class="tip">${ic('check','sm')}<div>Confirma que el dinero ya llegó a tu cuenta o datáfono antes de entregar.</div></div>`;

  }else{
    el.innerHTML=`<div class="tip warn">${ic('alert','sm')}<div>Se descuenta del inventario sin recibir dinero. Queda registrado como consumo propio.</div></div>`;
  }

function finishSale(){
  const t=cartTotal();let received=0,change=0;
  if(pay.m==='efectivo'){received=digits($('#recv').value)||t;if(received<t){toast('El dinero recibido es menor al total','bad');return}change=received-t}
  if(pay.m==='fiado'){const cid=$('#fcust')?$('#fcust').value:pay.cust;if(!cid){toast('Elige a qué cliente le fías','bad');return}pay.cust=cid}
  const caja=openCaja();if(!caja){toast('Abre la caja primero','bad');return}
  const sale={id:uid(),no:++S.counters.sale,ts:Date.now(),items:cart.map(l=>({pid:l.pid,name:l.name,qty:l.qty,price:l.price,cost:l.cost,bulk:!!l.bulk,iva:(prod(l.pid)||{}).iva||0})),total:t,cost:sum(cart,l=>l.cost*l.qty),method:pay.m,customerId:pay.m==='fiado'?pay.cust:(cartX.cust||''),received,change,cajaId:caja.id,subtotal:cartSub(),discount:cartDisc(),delivery:cartX.dom||0};
  for(const l of cart){const p=prod(l.pid);if(p){moveStock(p,-l.qty);p.sold=(p.sold||0)+l.qty}}
  S.sales.push(sale);save();
  const neg=[...new Set(sale.items.flatMap(i=>{const p=prod(i.pid);return !p?[]:isKit(p)?p.kit.map(c=>prod(c.pid)).filter(q=>q&&q.stock<0):(p.stock<0?[p]:[])}).map(q=>q.name))];
  cart=[];resetCartX();closeModal();renderCart();renderRes();
  const ov=modal('Venta registrada ✔',`
    <div class="center"><div class="b" style="font-size:30px;letter-spacing:-.6px">${money(sale.total)}</div>
    ${sale.method==='efectivo'&&sale.change>0?`<div class="mt b" style="font-size:20px">Devuelve ${money(sale.change)}</div>`:''}
    <div class="mut sm mt">Venta #${sale.no} · ${sale.method==='efectivo'?'Efectivo':sale.method==='digital'?'Transferencia / datáfono':sale.method==='fiado'?'Fiado a '+esc(cust(sale.customerId).name):'Consumo propio'}</div></div>
    ${neg.length?`<div class="tip warn mt">${ic('alert','sm')}<div>Stock en negativo en: ${neg.map(esc).join(', ')}. Revisa tu inventario.</div></div>`:''}
    <div class="g2 mt"><button class="btn" data-act="print-sale" data-id="${sale.id}">${ic('print','sm')} Recibo</button><button class="btn" data-act="print-sale-c" data-id="${sale.id}">${ic('print','sm')} Carta</button><button class="btn" data-act="wa-sale" data-id="${sale.id}">${ic('chat','sm')} WhatsApp</button></div>
    <button class="btn pri big mt" data-act="close">Nueva venta</button>`);
  if($('#vq'))setTimeout(()=>{},0);
}

function logoPick(input){
  const f=input.files&&input.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{const M=240,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    const url=c.toDataURL('image/png');$('#logov').value=url;$('#lprev').innerHTML=`<img src="${url}" alt="" style="object-fit:contain">`;$('#lquit').classList.remove('hide')};im.onerror=()=>toast('No se pudo leer la imagen','bad');im.src=rd.result};

function saleIva(s){const by={};if(s.void||s.method==='autoconsumo')return by;const f=s.subtotal?(s.subtotal-(s.discount||0))/s.subtotal:1;

function priceSync(f,src){
  const c=digits(f.cost.value);
  const fromPrice=()=>{const v=digits(f.price.value);f.margin.value=(v&&c)?String(Math.round((v-c)/v*1000)/10).replace('.',','):''};
  const fromMargin=()=>{const m=dec(f.margin.value);if(c&&m>0&&m<100)f.price.value=fmtInt(roundUp(c/(1-m/100)))};
  if(src==='price')fromPrice();

  else{ if(dec(f.margin.value)>0)fromMargin(); else fromPrice(); }
  marginHint();
}

function denomRead(f){const o={};let t=0;$$('[data-den]',f).forEach(i=>{const q=Math.max(0,Math.floor(+i.value||0)),v=+i.dataset.den;if(q){o[v]=q;t+=q*v}const sb=$('[data-sub="'+v+'"]',f);if(sb)sb.textContent=money(q*v)});const tt=$('#dtotal',f);if(tt)tt.textContent=money(t);return{o,t}}

  const {t}=denomRead(f);const c=$('[name=counted]',f);

function downloadCSV(){
  if(!lastTable)return;
  const q=v=>{v=String(v??'');return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const csv='﻿'+[lastTable.head,...lastTable.rows].map(r=>r.map(q).join(';')).join('\r\n');
  dl(csv,`cuadra_${lastTable.name}_${new Date().toISOString().slice(0,10)}.csv`,'text/csv;charset=utf-8');
}
function dl(text,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

async function restoreFile(file){
  try{
    const d=JSON.parse(await file.text());
    if(!d||!Array.isArray(d.products)||!d.meta)throw 0;
    if(!await ask('Restaurar copia',`Se reemplazarán los datos actuales por los de la copia (${d.products.length} productos, ${d.sales?.length||0} ventas).`,'Restaurar',true))return;
    S={...blank(),...d};save();toast('Copia restaurada','ok');render();
  }catch(e){toast('Ese archivo no es una copia de Cuadra','bad')}
}

function loadDemo(){
  const keep={business:S.meta.business,owner:S.meta.owner,type:S.meta.type};
  S=blank();Object.assign(S.meta,keep,{practice:true});
  let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const P=[['Arroz 500 g','Granos',1900,2500,40],['Aceite 1 L','Despensa',8200,9800,18],['Azúcar 1 kg','Granos',3600,4500,25],['Leche entera 1 L','Lácteos',3900,4600,30],['Huevo (unidad)','Lácteos',450,600,120],['Pan tajado','Panadería',3800,4800,12],['Café 250 g','Despensa',7600,9500,14],['Panela','Despensa',2800,3500,20],['Sal 500 g','Despensa',1100,1500,22],['Fríjol 500 g','Granos',3900,5000,16],['Gaseosa 1,5 L','Bebidas',4200,5500,24],['Agua 600 ml','Bebidas',1100,1800,36],['Galletas de sal','Snacks',1300,2000,28],['Papas fritas','Snacks',1900,2800,26],['Jabón de barra','Aseo',1700,2400,18],['Detergente 500 g','Aseo',4300,5600,12],['Papel higiénico x4','Aseo',5200,6800,10],['Atún en lata','Despensa',4300,5600,15],['Pasta 250 g','Granos',1700,2400,30],['Chocolate de mesa','Despensa',4600,5800,14],['Mantequilla','Lácteos',3300,4200,10],['Salchichas x5','Carnes frías',4800,6200,9],['Cuaderno','Papelería',2800,4000,12],['Lapicero','Papelería',600,1000,40],['Bolsa de hielo','Bebidas',900,1500,3]];
  const DC={'Granos':'Abarrotes y granos','Despensa':'Aceites y condimentos','Lácteos':'Lácteos y huevos','Panadería':'Pan y galletas','Bebidas':'Bebidas','Snacks':'Snacks y dulces','Aseo':'Aseo del hogar','Carnes frías':'Carnes y embutidos','Papelería':'Papelería y varios'};
  const DS=DEMOS[DEMO_OF[S.meta.type]];
  if(DS)DS.split('\n').forEach((ln,i)=>{const a=ln.split('|');S.products.push({id:uid()+i,name:a[0],cat:a[4],cost:+a[1],price:+a[2],stock:+a[3],min:+a[3]>=30?8:+a[3]>=900?0:5,loc:'Piso de venta',barcode:'77012345'+String(10000+i*37),sold:0,iva:+a[5]||0,bulk:a[6]==='k'})});
  else P.forEach((p,i)=>S.products.push({id:uid()+i,name:p[0],cat:DC[p[1]]||p[1],cost:p[2],price:p[3],stock:p[4],min:p[4]>=30?8:5,loc:i%4===0?'Bodega':'Piso de venta',barcode:'77012345'+String(10000+i*37),sold:0,iva:['Granos','Lácteos','Panadería'].includes(p[1])?0:19}));
  const N=S.products.length;S.products[N-1].stock=0;S.products[Math.max(0,N-9)].stock=3;S.products[Math.max(0,N-4)].stock=4;
  ['Doña Marta','Don Pedro','Luz Ángela','Carlos Ruiz','Yenny Gómez'].forEach((n,i)=>S.customers.push({id:'c'+i,name:n,phone:'30012345'+(10+i),notes:''}));
  S.suppliers.push({id:'s0',name:'Distribuidora El Surtido',phone:'3101234567'},{id:'s1',name:'Lácteos del Tolima',phone:'3207654321'});
  const t0=sod(Date.now());
  for(let d=6;d>=1;d--){
    const day=t0-d*DAY,caja={id:'k'+d,openedAt:day+7*36e5,initial:50000,closedAt:0};
    S.cajas.push(caja);
    const n=7+Math.floor(rnd()*7);
    for(let i=0;i<n;i++){
      const items=[],k=1+Math.floor(rnd()*4);
      for(let j=0;j<k;j++){const p=S.products[Math.floor(rnd()*(N-3))],q=1+Math.floor(rnd()*3);if(!items.find(x=>x.pid===p.id)){items.push({pid:p.id,name:p.name,qty:q,price:p.price,cost:p.cost,iva:p.iva||0,bulk:!!p.bulk});p.sold+=q}}
      const total=sum(items,l=>l.price*l.qty),r=rnd(),m=r<.6?'efectivo':r<.8?'digital':'fiado';
      S.sales.push({id:'v'+d+'_'+i,no:++S.counters.sale,ts:day+(8+Math.floor(rnd()*10))*36e5+Math.floor(rnd()*36e5),items,total,cost:sum(items,l=>l.cost*l.qty),method:m,customerId:m==='fiado'?'c'+Math.floor(rnd()*3):'',received:total,change:0,cajaId:caja.id});
    }
    const r=cajaSum(caja);Object.assign(caja,{closedAt:day+20*36e5,expected:r.expected,counted:r.expected-(d%3===0?2000:0),nSales:r.nSales,summary:r});caja.diff=caja.counted-caja.expected;
  }
  S.payments.push({id:'p1',ts:t0-3*DAY+36e5*12,type:'cliente',refId:'c0',amount:8000,method:'efectivo',cajaId:'k3'});
  S.purchases.push({id:'u1',ts:t0-4*DAY+36e5*9,supplierId:'s1',invoice:'F-1042',items:[{pid:S.products[3].id,name:S.products[3].name,qty:24,cost:3900}],total:93600,method:'credito',cajaId:''});
  save();
}

const CALC={open:false,expr:'',res:'0',done:false,target:null};
function calcPos(){return S.meta.calcPos||{x:innerWidth-70,y:innerHeight-170}}
function calcClamp(x,y,w,h){return{x:Math.max(6,Math.min(innerWidth-w-6,x)),y:Math.max(6,Math.min(innerHeight-h-6,y))}}

  document.body.appendChild(b);calcPlaceFab();
  dragify(b,b,(moved)=>{if(!moved)calcToggle()},p=>{S.meta.calcPos=p;save()},54,54,true);

function calcPlaceFab(){const b=$('#fcalc-fab');if(!b)return;const p=calcClamp(calcPos().x,calcPos().y,54,54);b.style.left=p.x+'px';b.style.top=p.y+'px'}
function calcPlacePanel(){const d=$('#fcalc');if(!d)return;const f=calcPos();const w=264,h=d.offsetHeight||380;
  let x=f.x+54-w,y=f.y-h-8;if(y<6)y=f.y+62;const p=calcClamp(x,y,w,h);d.style.left=p.x+'px';d.style.top=p.y+'px'}
function dragify(handle,box,onEnd,onSave,w,h,isFab){
  let sx,sy,ox,oy,moved=false,on=false;
  handle.addEventListener('pointerdown',e=>{if(e.target.closest('button')&&handle!==box&&e.target.closest('button')!==handle)return;on=true;moved=false;sx=e.clientX;sy=e.clientY;const r=box.getBoundingClientRect();ox=r.left;oy=r.top;handle.setPointerCapture(e.pointerId)});
  handle.addEventListener('pointermove',e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.abs(dx)+Math.abs(dy)<6)return;moved=true;
    const p=calcClamp(ox+dx,oy+dy,box.offsetWidth||w,box.offsetHeight||h);box.style.left=p.x+'px';box.style.top=p.y+'px'});
  handle.addEventListener('pointerup',e=>{if(!on)return;on=false;
    if(moved&&isFab){const r=box.getBoundingClientRect();onSave({x:Math.round(r.left),y:Math.round(r.top)});if(CALC.open)calcPlacePanel()}
    if(moved&&!isFab){const r=box.getBoundingClientRect();S.meta.calcPanel={x:Math.round(r.left),y:Math.round(r.top)};save()}
    onEnd&&onEnd(moved)});
}
function calcToggle(){CALC.open?calcClose():calcOpen()}
function calcClose(){CALC.open=false;const d=$('#fcalc');d&&d.remove()}
function calcOpen(){
  const ae=document.activeElement;CALC.target=(ae&&ae.tagName==='INPUT'&&ae.type!=='checkbox'&&ae.type!=='file')?ae:null;

  const K=[['C','fn'],['⌫','fn'],['%','op'],['÷','op'],['7'],['8'],['9'],['×','op'],['4'],['5'],['6'],['−','op'],['1'],['2'],['3'],['+','op'],['0'],['00'],[',' ],['=','eq']];
  d.innerHTML=`<div class="ch"><span>Calculadora</span><button data-ck="x" aria-label="Cerrar">×</button></div><div class="cd"><div class="ce"></div><div class="cr">0</div></div><div class="ck">${K.map(k=>`<button class="${k[1]||''}" data-ck="${k[0]}">${k[0]}</button>`).join('')}</div><div class="cf"><button data-ck="copy">Copiar</button>${CALC.target?'<button data-ck="use">Usar en el campo</button>':''}</div>`;
  document.body.appendChild(d);calcPlacePanel();

const calcNum=v=>{const n=Math.round(v*1e8)/1e8,[a,b]=String(n).split('.');return a.replace(/\B(?=(\d{3})+(?!\d))/g,'.')+(b?','+b:'')};
function calcEval(){
  let e=CALC.expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/,/g,'.');
  e=e.replace(/(\d+(?:\.\d+)?)\s*([+\-])\s*(\d+(?:\.\d+)?)%/g,(m,a,o,b)=>a+o+'('+a+'*'+b+'/100)').replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  if(!/^[0-9+\-*/().\s]+$/.test(e))return null;
  try{const v=Function('"use strict";return ('+e+')')();return isFinite(v)?v:null}catch(_){return null}
}
function calcShow(){
  const d=$('#fcalc');if(!d)return;
  $('.ce',d).textContent=CALC.expr;
  const v=CALC.expr?calcEval():0;
  const txt=v===null?(CALC.done?'Error':CALC.res):calcNum(v);
  if(v!==null)CALC.res=txt;
  const r=$('.cr',d);r.textContent=txt;r.style.fontSize=txt.length>11?'22px':txt.length>8?'26px':'32px';
}
function calcKey(k){
  if(k==='x'){calcClose();return}
  if(k==='copy'){const t=CALC.res.replace(/\./g,'').replace(',','.');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Copiado: '+CALC.res,'ok')).catch(()=>toast('No se pudo copiar','warn'));return}
  if(k==='use'){const i=CALC.target;if(i&&document.contains(i)){const v=calcEval();if(v!==null){const isMoney=i.classList.contains('money');i.value=isMoney?fmtInt(Math.round(v)):String(Math.round(v*1000)/1000).replace('.',',');i.dispatchEvent(new Event('input',{bubbles:true}));i.dispatchEvent(new Event('change',{bubbles:true}));toast('Valor puesto en el campo','ok');calcClose()}}else toast('Toca primero un campo','warn');return}
  const ops='+−×÷';
  if(k==='C'){CALC.expr='';CALC.res='0';CALC.done=false}
  else if(k==='⌫'){if(CALC.done){CALC.expr='';CALC.done=false}else CALC.expr=CALC.expr.slice(0,-1)}
  else if(k==='='){const v=calcEval();if(v!==null){CALC.expr=String(Math.round(v*1e8)/1e8).replace('.',',');CALC.done=true}else if(CALC.expr)CALC.done=true}
  else if(ops.includes(k)||k==='%'){
    if(!CALC.expr&&k!=='−')return;
    if(CALC.done)CALC.done=false;
    const last=CALC.expr.slice(-1);
    if(k==='%'){if(/\d/.test(last))CALC.expr+='%'}
    else if(ops.includes(last))CALC.expr=CALC.expr.slice(0,-1)+k;
    else CALC.expr+=k;
  }else{
    if(CALC.done){CALC.expr='';CALC.done=false}
    if(k===','){const seg=CALC.expr.split(/[+−×÷]/).pop();if(seg.includes(','))return;if(!seg)CALC.expr+='0'}
    CALC.expr+=k;
  }
  calcShow();
}

/* ---------- arranque ---------- */
(async function init(){
  await loadState();
  if(S.meta.business)shell();
  render();
  if(S.meta.business&&!sessOK())gate();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
