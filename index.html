<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2740D8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cuadra · tu negocio al día</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --pri:#2740D8; --pri-d:#1B2FA8; --pri-l:#E8ECFF;
  --acc:#FF8A1F; --acc-l:#FFF1E2;
  --bg:#F5F6FA; --card:#fff; --ink:#151A2E; --mut:#6B7390; --line:#E3E6F0;
  --ok:#12A150; --ok-l:#E3F6EB; --bad:#E5384B; --bad-l:#FDE8EA; --warn:#B7791F; --warn-l:#FFF4D6;
  --r:16px; --navh:64px; --side:232px;
  --sh:0 1px 2px rgba(21,26,46,.06),0 6px 18px rgba(21,26,46,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0}
.hide{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:18px;height:18px}
svg.i.lg{width:30px;height:30px}

/* ---------- shell ---------- */
#shell{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
.top .back{display:none;border:0;background:var(--pri-l);color:var(--pri);width:40px;height:40px;border-radius:12px;align-items:center;justify-content:center;cursor:pointer}
.top .back.show{display:inline-flex}
.top #cajachip{margin-left:auto}
@media (max-width:899px){.top:not(.ishome) .logo span{display:none}.top.ishome h1{display:none}}
.top h1{font-size:18px;font-weight:800;letter-spacing:-.2px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;letter-spacing:-.6px;color:var(--pri-d)}
.logo svg{width:30px;height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:700;border:0;cursor:pointer}
.chip.ok{background:var(--ok-l);color:var(--ok)} .chip.off{background:var(--bad-l);color:var(--bad)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
main.wideV{max-width:1500px}
main{flex:1;padding:14px;padding-bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom));max-width:1100px;width:100%;margin:0 auto}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--navh);color:var(--mut);text-decoration:none;font-size:11.5px;font-weight:700;cursor:pointer}
nav.nav a.on{color:var(--pri)}
nav.nav a.on svg{stroke-width:2.4}
nav.nav .wide-only{display:none}
.sidelogo{display:none}

@media (min-width:900px){
  #shell{display:grid;grid-template-columns:var(--side) 1fr;grid-template-rows:auto 1fr}
  .top{grid-column:2;grid-row:1}
  main{grid-column:2;grid-row:2;padding-bottom:40px;padding:22px 26px}
  nav.nav{position:sticky;top:0;grid-column:1;grid-row:1 / span 2;height:100vh;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:14px 10px;gap:2px;align-self:start}
  nav.nav a{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 14px;border-radius:12px;font-size:15px}
  nav.nav a.on{background:var(--pri-l)}
  nav.nav .wide-only{display:flex}
  nav.nav .narrow-only{display:none}
  .sidelogo{display:flex;padding:8px 10px 18px}
  .top .logo{display:none}
}

/* ---------- ui ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.panel+.panel{margin-top:12px}
.panel h3{font-size:15px;font-weight:800;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.mut{color:var(--mut)} .sm{font-size:13px} .xs{font-size:12px}
.b{font-weight:800} .right{text-align:right} .center{text-align:center}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.mt{margin-top:12px} .mt2{margin-top:20px} .mb{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.acc{background:var(--acc);border-color:var(--acc);color:#2A1500}
.btn.soft{background:var(--pri-l);border-color:var(--pri-l);color:var(--pri)}
.btn.danger{background:var(--bad-l);border-color:var(--bad-l);color:var(--bad)}
.btn.big{min-height:54px;font-size:17px;width:100%}
.btn.icon{padding:0;width:46px}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn[disabled]{opacity:.5;pointer-events:none}
label.f{display:block;font-size:13px;font-weight:700;color:var(--mut);margin-bottom:4px}
.in{width:100%;min-height:46px;padding:0 14px;border:1.5px solid #D3DAF2;border-radius:12px;background:#EFF3FF;outline:none;transition:background .15s,border-color .15s}
textarea.in{padding:10px 14px;min-height:70px}
.in::placeholder{color:#8B93B3}
.in:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-l);background:#fff}
main>.searchbar .in,#vsearch .in{background:#fff}
form[data-form=product] input[name=margin]{background:#FFF4E5;border-color:#F3D3A3}
form[data-form=product] input[name=price]{background:#E8F7EE;border-color:#B9E2C8}
form[data-form=product] input[name=margin]:focus,form[data-form=product] input[name=price]:focus{background:#fff}
form[data-form=product] label.f{color:#5A6385}
.fg{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.searchbar{display:flex;gap:8px}
.seg{display:flex;background:#EEF0F7;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;min-height:40px;border-radius:11px;font-weight:800;color:var(--mut);cursor:pointer;font-size:14px}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chips button{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--mut)}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800}
.badge.ok{background:var(--ok-l);color:var(--ok)} .badge.low{background:var(--warn-l);color:var(--warn)} .badge.out{background:var(--bad-l);color:var(--bad)} .badge.gray{background:#EEF0F7;color:var(--mut)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:700} .item .s{font-size:13px;color:var(--mut)}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.kpi .l{font-size:12.5px;color:var(--mut);font-weight:700}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.4px;margin-top:2px}
.kpi.hl{background:var(--pri);border-color:var(--pri);color:#fff} .kpi.hl .l{color:#C9D2FF}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mod{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--sh);cursor:pointer;text-decoration:none;color:inherit;min-height:104px}
.mod .ic{width:44px;height:44px;border-radius:13px;background:var(--pri-l);color:var(--pri);display:flex;align-items:center;justify-content:center}
.mod:nth-child(3n+2) .ic{background:var(--acc-l);color:#C25E00}
.mod:nth-child(3n) .ic{background:var(--ok-l);color:var(--ok)}
.mod b{font-size:16px} .mod span{font-size:13px;color:var(--mut);margin-top:-6px}
.tip{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border-radius:13px;background:#F0F3FF;margin-top:8px;font-size:14.5px;cursor:default}
.tip.bad{background:var(--bad-l)} .tip.warn{background:var(--warn-l)} .tip.ok{background:var(--ok-l)}
.tip button{margin-left:auto;border:0;background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:13px;color:var(--pri);white-space:nowrap}
.empty{text-align:center;padding:28px 14px;color:var(--mut)}
.empty .big{font-size:44px}
.empty b{display:block;color:var(--ink);font-size:17px;margin:6px 0 4px}
.banner{background:var(--acc-l);border:1px solid #FFD6A8;border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px;margin-bottom:12px}
.banner button{margin-left:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;color:var(--mut);text-align:left;padding:8px 6px;border-bottom:1.5px solid var(--line);white-space:nowrap}
table.t td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.r,table.t th.r{text-align:right}
.scroll-x{overflow-x:auto}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:8px}
.bars .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--mut)}
.bars .bar i{display:block;width:100%;max-width:38px;background:var(--pri);border-radius:8px 8px 3px 3px;min-height:3px}
.bars .bar.today i{background:var(--acc)}
.hbar{height:10px;border-radius:6px;background:#EEF0F7;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--pri);border-radius:6px}

/* sale layout */
.vgrid{display:grid;gap:12px;grid-template-areas:"s" "c" "r"}
#vsearch{grid-area:s} #vcart{grid-area:c} #vres{grid-area:r}
@media (min-width:900px){.vgrid{grid-template-columns:minmax(0,1fr) 420px;grid-template-areas:"s c" "r c";align-items:start}#vcart{position:sticky;top:76px}}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:600px){.pgrid{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1200px){.pgrid{grid-template-columns:repeat(4,1fr)}}
@media (min-width:1500px){.pgrid{grid-template-columns:repeat(5,1fr)}}
.vgrid>*{min-width:0}
.vchips{margin-bottom:10px}
.total.big{font-size:26px}
.kbd{font:700 11px/1 inherit;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 6px;color:var(--mut);margin-left:6px;background:#fff}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pcard{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;cursor:pointer;min-height:84px}
.pcard:active{background:var(--pri-l)} .pcard .n{font-weight:700;font-size:14.5px;line-height:1.2} .pcard .p{font-weight:800;color:var(--pri);margin-top:auto}
.pcard .st{font-size:12px;color:var(--mut)} .pcard.out{opacity:.55}
.cline{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cline:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:18px;cursor:pointer;line-height:1}
.qty input{width:48px;height:34px;text-align:center;border:1.5px solid var(--line);border-radius:10px;font-weight:800}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:26px;letter-spacing:-.5px;margin:10px 0}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(15,20,45,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:92vh;display:flex;flex-direction:column;animation:up .18s ease-out}
.sheet.wide{max-width:760px}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.sh-h h3{font-size:18px;font-weight:800}
.x{border:0;background:#EEF0F7;width:36px;height:36px;border-radius:50%;font-size:22px;line-height:1;cursor:pointer;color:var(--mut)}
.sh-b{padding:8px 16px 18px;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.ovl{align-items:center}.sheet{border-radius:22px}}
.pm{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pm button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font-weight:800;text-align:left}
.pm button small{font-weight:600;color:var(--mut);font-size:12px}
.pm button.on{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-weight:700;cursor:pointer;font-size:13px}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:700;font-size:14.5px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .15s}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)} .toast.warn{background:#8A5A00}
video#cam{width:100%;border-radius:16px;background:#000;max-height:60vh}
.hero{background:linear-gradient(135deg,var(--pri) 0%,#4B63F0 100%);color:#fff;border-radius:22px;padding:22px 20px;box-shadow:var(--sh)}
.hero h2{font-size:26px;letter-spacing:-.6px}
.onb{max-width:460px;width:100%;margin:0 auto;padding:18px;grid-column:1 / -1}
.onb .panel{margin-top:14px}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block;font-family:monospace;font-size:12px;width:72mm;color:#000}
  #print h4{text-align:center;font-size:14px;margin-bottom:4px}
  #print .l{display:flex;justify-content:space-between;gap:8px}
  #print hr{border:0;border-top:1px dashed #000;margin:6px 0}
  @page{margin:4mm}
}
</style>
</head>
<body>
<div id="shell"></div>
<div id="toasts"></div>
<div id="print"></div>

/* ---------- utilidades ---------- */

const money=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Math.round(n||0));

const dec=v=>{const n=parseFloat(String(v||'').replace(',','.'));return isFinite(n)?n:0};

function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('cuadra',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const idbGet=k=>new Promise((res,rej)=>{const q=idb.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbSet=(k,v)=>new Promise((res,rej)=>{const t=idb.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)});
async function loadState(){
  try{idb=await idbOpen();S=await idbGet('state')}catch(e){useLS=true}
  if(useLS){try{S=JSON.parse(localStorage.getItem('cuadra_state')||'null')}catch(e){S=null}}
  if(!S)S=blank();
  S={...blank(),...S};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}

const openCaja=()=>S.cajas.find(c=>!c.closedAt);
const prod=id=>S.products.find(p=>p.id===id);

function custBalance(id){
  return sum(S.sales.filter(s=>!s.void&&s.method==='fiado'&&s.customerId===id),s=>s.total)
       - sum(S.payments.filter(p=>p.type==='cliente'&&p.refId===id&&!p.void),p=>p.amount);
}
function suppBalance(id){
  return sum(S.purchases.filter(s=>s.method==='credito'&&s.supplierId===id),s=>s.total)
       - sum(S.payments.filter(p=>p.type==='proveedor'&&p.refId===id),p=>p.amount);
}
const totalCartera=()=>sum(S.customers,c=>Math.max(0,custBalance(c.id)));
function cajaSum(c){
  const r={initial:c.initial,cash:0,digital:0,fiado:0,auto:0,nSales:0,abonosCash:0,ingresos:0,gastos:0,egresos:0,comprasCash:0,pagosProvCash:0};
  for(const s of S.sales){ if(s.cajaId!==c.id||s.void)continue; r.nSales++;
    if(s.method==='efectivo')r.cash+=s.total; else if(s.method==='digital')r.digital+=s.total; else if(s.method==='fiado')r.fiado+=s.total; else r.auto+=s.total;}
  for(const p of S.payments){ if(p.cajaId!==c.id||p.void||p.method!=='efectivo')continue;
    if(p.type==='cliente')r.abonosCash+=p.amount; else r.pagosProvCash+=p.amount;}
  for(const m of S.movements){ if(m.cajaId!==c.id)continue;
    if(m.type==='ingreso')r.ingresos+=m.amount; else if(m.type==='gasto')r.gastos+=m.amount; else r.egresos+=m.amount;}
  for(const p of S.purchases){ if(p.cajaId!==c.id||p.method!=='efectivo')continue; r.comprasCash+=p.total;}
  r.expected=r.initial+r.cash+r.abonosCash+r.ingresos-r.gastos-r.egresos-r.comprasCash-r.pagosProvCash;
  return r;
}
function range(k){
  const t0=sod(Date.now());
  if(k==='ayer')return[t0-DAY,t0];
  if(k==='7d')return[t0-6*DAY,t0+DAY];
  if(k==='mes'){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);return[d.getTime(),t0+DAY]}
  if(k==='todo')return[0,t0+DAY];
  return[t0,t0+DAY];
}
const salesIn=(a,b)=>S.sales.filter(s=>!s.void&&s.ts>=a&&s.ts<b);
const profit=ss=>sum(ss.filter(s=>s.method!=='autoconsumo'),s=>s.total-s.cost);

/* ---------- avisos (el "Cuadra te dice") ---------- */
function insights(){
  const out=[], now=Date.now(), [t0]=range('hoy');
  if(!S.products.length)out.push({t:'',x:'Empieza creando tus productos. Puedes escanear el código de barras con la cámara.',go:'productos',l:'Crear'});
  const agot=S.products.filter(p=>p.stock<=0).length;
  const bajo=S.products.filter(p=>p.stock>0&&p.stock<=p.min).length;
  if(agot)out.push({t:'bad',x:`${agot} ${plural(agot,'producto agotado','productos agotados')}. Revisa qué toca reponer.`,go:'productos?f=agotado',l:'Ver'});
  if(bajo)out.push({t:'warn',x:`${bajo} ${plural(bajo,'producto está','productos están')} por acabarse.`,go:'productos?f=bajo',l:'Ver'});
  const deud=S.customers.map(c=>({c,b:custBalance(c.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
  if(deud.length){
    const top=deud[0];
    const abonos=S.payments.filter(p=>p.type==='cliente'&&p.refId===top.c.id&&!p.void).map(p=>p.ts);
    const fiados=S.sales.filter(s=>!s.void&&s.method==='fiado'&&s.customerId===top.c.id).map(s=>s.ts);
    const last=abonos.length?Math.max(...abonos):Math.min(...fiados);
    const dias=Math.floor((now-last)/DAY);
    out.push({t:dias>=15?'warn':'',x:`Te deben ${money(totalCartera())} en total. El que más debe es ${esc(top.c.name)} (${money(top.b)})${dias>=15?`, lleva ${dias} días sin abonar`:''}.`,go:'clientes',l:'Cobrar'});
  }
  const yS=salesIn(t0-DAY,t0);
  if(yS.length&&!salesIn(t0,t0+DAY).length)out.push({t:'ok',x:`Ayer vendiste ${money(sum(yS.filter(s=>s.method!=='autoconsumo'),s=>s.total))} y tu ganancia estimada fue ${money(profit(yS))}.`});
  if(S.sales.length&&Date.now()-S.meta.lastBackup>7*DAY&&!S.meta.practice)out.push({t:'warn',x:'Hace más de una semana que no guardas una copia de seguridad. Tus datos viven solo en este equipo.',go:'mas',l:'Respaldar'});
  if(!openCaja()&&S.products.length)out.push({t:'',x:'La caja está cerrada. Ábrela para empezar a vender.',go:'caja',l:'Abrir'});
  return out;
}

/* ---------- toasts, modales, confirmaciones ---------- */
function toast(m,t=''){
  const e=document.createElement('div');e.className='toast '+t;e.textContent=m;$('#toasts').appendChild(e);
  setTimeout(()=>e.remove(),t==='bad'||t==='warn'?4200:2200);
}
function modal(title,body,o={}){
  const ov=document.createElement('div');ov.className='ovl';
  ov.innerHTML=`<div class="sheet ${o.wide?'wide':''}" role="dialog" aria-modal="true"><div class="sh-h"><h3>${title}</h3><button class="x" data-act="close" aria-label="Cerrar">×</button></div><div class="sh-b">${body}</div></div>`;
  ov._close=o.onClose;
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal(ov)});
  document.body.appendChild(ov);
  const f=$('[autofocus]',ov);if(f)setTimeout(()=>{f.focus();f.select&&f.select()},60);
  return ov;
}
function closeModal(ov){ov=ov||$$('.ovl').pop();if(!ov)return;ov.remove();ov._close&&ov._close()}
const modalEl=()=>$$('.ovl').pop();
function ask(title,text,ok='Aceptar',danger=false){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(!done){done=true;res(v)}};
    const ov=modal(title,`<p class="mut" style="margin:6px 0 16px">${text}</p><div class="g2"><button class="btn" data-act="close">Cancelar</button><button class="btn ${danger?'danger':'pri'}" data-act="ask-ok">${ok}</button></div>`,{onClose:()=>fin(false)});
    ov._ok=()=>{fin(true);ov.remove()};
  });
}

/* ---------- sonido y cámara ---------- */
let actx;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(actx.currentTime+.09)}catch(e){}}
async function scanner(onCode,continuous){
  if(!('BarcodeDetector' in window)){toast('Este navegador no lee códigos con cámara. Usa la pistola lectora o escribe el código.','warn');return}
  let stream,stop=false,last='',lastT=0;
  const ov=modal('Escanear código',`<video id="cam" playsinline muted></video><p class="mut sm center mt">Apunta al código de barras. ${continuous?'Puedes seguir escaneando.':''}</p><button class="btn big mt" data-act="close">Terminar</button>`,{onClose:()=>{stop=true;stream&&stream.getTracks().forEach(t=>t.stop())}});
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('#cam',ov);v.srcObject=stream;await v.play();
    const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf','qr_code']});
    const tick=async()=>{
      if(stop)return;
      try{const r=await det.detect(v);
        if(r.length){const c=r[0].rawValue,n=Date.now();
          if(c!==last||n-lastT>1600){last=c;lastT=n;beep();onCode(c);if(!continuous){closeModal(ov);return}}}
      }catch(e){}
      setTimeout(tick,180);
    };tick();
  }catch(e){closeModal(ov);toast('No pude abrir la cámara. Revisa el permiso del navegador.','bad')}
}

function findProducts(q,limit=40){
  q=norm(q.trim());

  const exact=S.products.filter(p=>p.barcode&&p.barcode===q);
  if(exact.length)return exact;
  return S.products.filter(p=>norm(p.name).includes(q)||(p.barcode||'').includes(q)||norm(p.cat).includes(q)).slice(0,limit);
}

   'clear-cart'(){cart=[];renderCart()},
   'vcat'(){vcat=d.c||'';renderRes()},
   qty(){const l=cart[+d.i];l.qty=Math.max(0,Math.round((l.qty+(+d.d))*1000)/1000);if(l.qty<=0)cart.splice(+d.i,1);renderCart()},
   cobrar(){cobrar()},
   'pay-m'(){pay.m=d.m;payPanel()},
   quick(){const i=$('#recv');i.value=fmtInt(+d.v);i.dispatchEvent(new Event('input',{bubbles:true}))},
   'pay-ok'(){finishSale()},
   'new-cust-pay'(){custForm('',c=>{pay.cust=c.id;payPanel()})},
   'print-sale'(){printSale(d.id)},
   'wa-sale'(){const s=S.sales.find(x=>x.id===d.id);window.open(waLink((cust(s.customerId)||{}).phone||'',saleText(s)),'_blank')},
   'new-product'(){productForm(null,{barcode:d.code||'',name:d.name||'',buy:!!d.buy})},
   'edit-product'(){productForm(d.id)},
   'del-product'(){ask('Eliminar producto','Se borra del inventario. Las ventas pasadas se conservan.','Eliminar',true).then(ok=>{if(ok){S.products=S.products.filter(p=>p.id!==d.id);save();closeModal();toast('Producto eliminado');render()}})},
   pfilter(){window._pf=d.f;$$('#pf button').forEach(b=>b.classList.toggle('on',b===el));plist()},
   'new-cust'(){custForm('')},
   'edit-cust'(){closeModal();custForm(d.id)},
   'cust-detail'(){custDetail(d.id)},
   'del-cust'(){if(custBalance(d.id)>0){toast('Tiene deuda pendiente. Cóbrala antes de eliminar.','warn');return}ask('Eliminar cliente','Se borra de tu lista.','Eliminar',true).then(ok=>{if(ok){S.customers=S.customers.filter(c=>c.id!==d.id);save();closeModal();render()}})},
   'cust-abono'(){closeModal();abonoForm(d.id,'cliente')},
   'cust-wa'(){const c=cust(d.id);window.open(waLink(c.phone,`Hola ${c.name}, te escribimos de ${S.meta.business}. Tienes un saldo pendiente de ${money(custBalance(c.id))}. ¡Gracias por tu compra y tu pronto pago!`),'_blank')},
   seg(){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));el.closest('form').elements[d.k].value=d.v},
   seg2(){el.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));el.closest('form').elements.type.value=d.v},
   'mov-form'(){movForm()},
   'close-caja'(){closeCajaForm()},
   'caja-detail'(){const c=S.cajas.find(x=>x.id===d.id),r=c.summary||cajaSum(c);modal('Cierre del '+fmtD(c.openedAt),`<div class="list">${[['Caja inicial',r.initial],['Ventas en efectivo',r.cash],['Transferencia / datáfono',r.digital],['Fiado',r.fiado],['Abonos (efectivo)',r.abonosCash],['Gastos',-r.gastos],['Retiros',-r.egresos],['Compras en efectivo',-r.comprasCash]].map(x=>`<div class="item" style="cursor:default;padding:8px 0"><div class="grow mut">${x[0]}</div><b>${money(x[1])}</b></div>`).join('')}</div><div class="total"><span>Debía haber</span><span>${money(c.expected)}</span></div><div class="row between b"><span>Contado</span><span>${money(c.counted)}</span></div><div class="tip ${c.diff===0?'ok':'warn'} mt">${c.diff===0?'Cuadró perfecto':c.diff>0?'Sobraron '+money(c.diff):'Faltaron '+money(-c.diff)}${c.note?' · '+esc(c.note):''}</div><button class="btn mt" data-act="wa-close" data-id="${c.id}">${ic('chat','sm')} Compartir por WhatsApp</button>`)},
   'wa-close'(){const c=S.cajas.find(x=>x.id===d.id);window.open('https://wa.me/?text='+encodeURIComponent(closeText(c)),'_blank')},
   ctab(){window._ctab=d.t;render()},
   'new-purchase'(){pd=null;go('compra')},
   pmeth(){pd.method=d.m;pmethUI()},
   'pur-add'(){addPurchaseLine(d.id);$('#pq2').value='';purRes()},
   'pur-del'(){pd.items.splice(+d.i,1);purLines()},
   'save-purchase'(){savePurchase()},
   'new-supp'(){suppForm('')},
   'new-supp-p'(){suppForm('',s=>{pd.supplierId=s.id;render()})},
   'edit-supp'(){closeModal();suppForm(d.id)},
   'supp-detail'(){suppDetail(d.id)},
   'supp-pay'(){closeModal();abonoForm(d.id,'proveedor')},
   'purchase-detail'(){const p=S.purchases.find(x=>x.id===d.id);modal('Compra del '+fmtD(p.ts),`<p class="mut" style="margin:0 0 8px">${esc((supp(p.supplierId)||{}).name||'Sin proveedor')}${p.invoice?' · Fact. '+esc(p.invoice):''}</p><div class="list">${p.items.map(i=>`<div class="item" style="cursor:default"><div class="grow"><div class="t">${esc(i.name)}</div><div class="s">${qfmt(i.qty)} × ${money(i.cost)}</div></div><b>${money(i.qty*i.cost)}</b></div>`).join('')}</div><div class="total"><span>Total</span><span>${money(p.total)}</span></div>`)},
   rtab(){rep.tab=d.t;render()},
   rrng(){rep.rng=d.r;render()},
   csv(){downloadCSV()},
   'sale-detail'(){const s=S.sales.find(x=>x.id===d.id),c=openCaja(),can=!s.void&&c&&s.cajaId===c.id;
     modal('Venta #'+s.no,`<p class="mut" style="margin:0 0 8px">${fmtDT(s.ts)} · ${{efectivo:'Efectivo',digital:'Transferencia',fiado:'Fiado',autoconsumo:'Consumo propio'}[s.method]}${s.void?' · ANULADA':''}</p><div class="list">${s.items.map(i=>`<div class="item" style="cursor:default"><div class="grow"><div class="t">${esc(i.name)}</div><div class="s">${qfmt(i.qty)} × ${money(i.price)}</div></div><b>${money(i.price*i.qty)}</b></div>`).join('')}</div><div class="total"><span>Total</span><span>${money(s.total)}</span></div><div class="g2"><button class="btn" data-act="print-sale" data-id="${s.id}">${ic('print','sm')} Recibo</button><button class="btn danger" data-act="void-sale" data-id="${s.id}" ${can?'':'disabled'}>Anular venta</button></div>${can?'':'<p class="mut xs mt">Solo se pueden anular ventas de la caja abierta.</p>'}`)},
   'void-sale'(){ask('Anular venta','Los productos vuelven al inventario y la venta deja de contar.','Anular',true).then(ok=>{if(!ok)return;const s=S.sales.find(x=>x.id===d.id);s.void=true;s.items.forEach(i=>{const p=prod(i.pid);if(p){p.stock=Math.round((p.stock+i.qty)*1000)/1000;p.sold=Math.max(0,(p.sold||0)-i.qty)}});save();$$('.ovl').forEach(o=>o.remove());toast('Venta anulada');render()})},
   backup(){doBackup()},
   restore(){$('#rfile').click()},
   'load-demo'(){ask('Cargar datos de ejemplo','Reemplaza los datos que tengas ahora por datos de práctica.','Cargar',true).then(ok=>{if(ok){loadDemo();toast('Datos de ejemplo listos','ok');go('home');render()}})},
   wipe(){ask('Borrar todos mis datos','Se elimina todo: productos, ventas, clientes y cajas. No se puede deshacer. Descarga una copia antes si dudas.','Borrar todo',true).then(ok=>{if(ok){S=blank();save();location.hash='#/home';location.reload()}})}
  };
  if(A[a]){try{await A[a]()}catch(err){console.error(err)}}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form;
  if(k==='onb'){const fd=new FormData(f);S.meta.business=fd.get('business').trim();S.meta.owner=fd.get('owner').trim();S.meta.type=readType(fd);
    if(fd.get('mode')==='demo'){loadDemo()}else{save()}
    location.hash='#/home';shell();render();return}
  if(k==='product')saveProduct(f);
  if(k==='cust')saveCust(f);
  if(k==='supp'){const fd=new FormData(f),id=f.dataset.id,o={name:fd.get('name').trim(),phone:fd.get('phone').replace(/\D/g,'')};let s;if(id){s=supp(id);Object.assign(s,o)}else{s={id:uid(),...o};S.suppliers.push(s)}save();const ov=modalEl(),cb=ov&&ov._after;closeModal();toast('Proveedor guardado','ok');cb?cb(s):render()}
  if(k==='abono')saveAbono(f);
  if(k==='opencaja'){const initial=digits(new FormData(f).get('initial'));const c={id:uid(),openedAt:Date.now(),initial,closedAt:0};S.cajas.push(c);save();const ov=modalEl();ov&&ov._res&&ov._res(c);closeModal();toast('Caja abierta','ok');render()}
  if(k==='mov'){const fd=new FormData(f),c=openCaja();S.movements.push({id:uid(),ts:Date.now(),type:fd.get('type'),concept:fd.get('concept').trim(),amount:digits(fd.get('amount')),cajaId:c.id});save();closeModal();toast('Movimiento guardado','ok');render()}
  if(k==='closecaja')saveClose(f);
  if(k==='pricing'){const fd=new FormData(f);const m=dec(fd.get('defMargin'));S.meta.defMargin=(m>0&&m<100)?m:0;S.meta.round=+fd.get('round')||0;save();toast('Guardado','ok');render()}
  if(k==='biz'){const fd=new FormData(f);S.meta.business=fd.get('business').trim();S.meta.owner=fd.get('owner').trim();S.meta.type=readType(fd);save();toast('Guardado','ok');render()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('money')){const n=digits(t.value);t.value=n?fmtInt(n):''}
  if(t.id==='recv'){const tot=cartTotal(),r=digits(t.value);$('#chg').textContent=money(Math.max(0,r-tot))}
  if(t.closest&&t.closest('form[data-form="product"]')&&['cost','price','margin'].includes(t.name))priceSync(t.closest('form'),t.name);
  if(t.closest&&t.closest('form[data-form="closecaja"]')&&t.name==='counted'){
    const f=t.closest('form'),exp=+f.dataset.exp,c=digits(t.value),box=$('#diff');
    if(t.value===''){box.classList.add('hide');return}
    const d=c-exp;box.className='tip '+(d===0?'ok':'warn');box.innerHTML=d===0?'✔ ¡Cuadra perfecto!':d>0?`Te sobran ${money(d)}`:`Te faltan ${money(-d)}`;
  }
  if(t.dataset&&t.dataset.pl!==undefined){const l=pd.items[+t.dataset.pl];l[t.dataset.f]=t.dataset.f==='qty'?dec(t.value):digits(t.value);purTotal()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.qty!==undefined){const i=+t.dataset.qty,q=dec(t.value);if(q<=0)cart.splice(i,1);else cart[i].qty=q;renderCart()}
  if(t.id==='fcust')pay.cust=t.value;
  if(t.id==='catsel'){const o=$('#cato');o.classList.toggle('hide',t.value!=='__otra');if(t.value==='__otra')o.focus()}
  if(t.id==='btype'){const o=$('#btypeo');o.classList.toggle('hide',t.value!=='Otro');if(t.value==='Otro')o.focus()}
  if(t.id==='rfile'&&t.files[0]){restoreFile(t.files[0]);t.value=''}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modalEl()){closeModal();return}
    if(parseHash().r==='vender'&&cart.length&&!(e.target.dataset&&e.target.dataset.qty!=null)){cart=[];renderCart();toast('Venta vaciada','ok')}return}
  if(e.key==='F2'&&!modalEl()&&parseHash().r==='vender'){e.preventDefault();if(cart.length)cobrar();else toast('Agrega productos primero','warn')}
});

/* ---------- arranque ---------- */
(async function init(){
  await loadState();
  if(S.meta.business)shell();
  render();
  if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
